# Fork-only: builds the immich-server image (server + web UI) from this
# branch and publishes it to this repo's GitHub Container Registry.
name: Fork server image

on:
  push:
    branches: [fix/mobile-custom-cookie-header-auth]
    paths: ['server/**', 'web/**', 'open-api/**', 'packages/**', 'i18n/**', 'pnpm-lock.yaml', '.github/workflows/fork-server-image.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  server:
    if: ${{ github.repository != 'immich-app/immich' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read version
        id: meta
        run: |
          echo "version=$(jq -r .version server/package.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immich-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=v${{ steps.meta.outputs.version }}-fork
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}-fork
            ${{ steps.meta.outputs.image }}:fork-latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
